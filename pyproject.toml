[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "verejna-kontrola"
version = "0.1.0"
description = "Platforma veřejné kontroly (Datové pole) – toky veřejných peněz napojené na kotvu přes IČO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "certifi>=2024.2",
    "lxml>=5.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pillow>=10.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
pvk = "pvk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: test vyžaduje PostgreSQL (DATABASE_URL); bez databáze test selže, nepřeskočí se",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
